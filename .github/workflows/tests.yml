name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Core tests
        run: python -m unittest discover -s tests -v
      - name: QML smoke (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          BIRTHDAY_STUDIO_HOME: ${{ runner.temp }}/bs-home
        run: python -m app --screenshot "${{ runner.temp }}/editor.png" --screenshot-delay 2500
